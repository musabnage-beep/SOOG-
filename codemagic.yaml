workflows:
  ios-release:
    name: iOS Release — الضيافة
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic

    environment:
      # Pinned, not `stable`: a floating channel silently moved the toolchain
      # under a pipeline that had not changed, which enabled Swift Package
      # Manager mid-build and broke signing. This is the version the local
      # analyze/test run is verified against.
      flutter: 3.41.4
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing             # CERTIFICATE_PRIVATE_KEY (base64 RSA key)
      vars:
        BUNDLE_ID: com.aldiafah.aldiafa
        APP_STORE_APP_ID: "6791276970"

    scripts:
      - name: Install Flutter dependencies
        script: |
          cd apps/mobile
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd apps/mobile/ios
          pod install

      - name: Set up code signing
        script: |
          # Without `set -e` the step's exit status is only that of the LAST
          # command, so a failed fetch-signing-files was swallowed: use-profiles
          # exits 0 when it finds no profiles to apply, the step went green, and
          # the build died a minute later inside `flutter build ipa` with the
          # misleading "No development certificates available".
          set -euo pipefail
          keychain initialize
          echo "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -A > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          # This is a monorepo: the default `**/*.xcodeproj` glob runs from the
          # repository root and also matches Pods.xcodeproj, so name the target
          # project explicitly.
          xcode-project use-profiles --project apps/mobile/ios/Runner.xcodeproj

          # Fail here, loudly, rather than let Flutter fall back to scanning the
          # keychain for a *development* certificate that an App Store build
          # never has. The Flutter template ships CODE_SIGN_STYLE=Automatic with
          # no DEVELOPMENT_TEAM; use-profiles is what rewrites both.
          if ! grep -q DEVELOPMENT_TEAM apps/mobile/ios/Runner.xcodeproj/project.pbxproj; then
            echo "use-profiles did not apply signing settings to Runner.xcodeproj"
            exit 1
          fi

      - name: Build iOS IPA
        script: |
          cd apps/mobile
          flutter build ipa --release \
            --build-name=1.0.32 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # No `beta_groups:` — "team" is an INTERNAL TestFlight group and the App
        # Store Connect API refuses to attach builds to internal groups
        # ("Cannot add internal group to a build"), which failed the whole step
        # even though the IPA had already uploaded fine. Internal testers receive
        # every processed build automatically, so nothing is lost. Only list a
        # group here if it is an EXTERNAL one.

  android-release:
    name: Android Release — الضيافة
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.41.4
      vars:
        PACKAGE_NAME: com.aldiafah.aldiafa

    scripts:
      - name: Set TMP path
        script: export TMP=/tmp && export TEMP=/tmp

      - name: Install Flutter dependencies
        script: |
          cd apps/mobile
          flutter pub get

      - name: Build APK
        script: |
          cd apps/mobile
          flutter build apk --release \
            --build-name=1.0.32 \
            --build-number=$PROJECT_BUILD_NUMBER

    artifacts:
      - apps/mobile/build/app/outputs/flutter-apk/app-release.apk
