workflows:
  ios-release:
    name: iOS Release — الضيافة
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing             # CERTIFICATE_PRIVATE_KEY (base64 RSA key)
      vars:
        BUNDLE_ID: com.aldiafah.aldiafa
        APP_STORE_APP_ID: "6791276970"

    scripts:
      - name: Install Flutter dependencies
        script: |
          cd apps/mobile
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd apps/mobile/ios
          pod install

      - name: Set up code signing
        script: |
          keychain initialize
          echo "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -A > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd apps/mobile
          flutter build ipa --release \
            --build-name=1.0.29 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # No `beta_groups:` — "team" is an INTERNAL TestFlight group and the App
        # Store Connect API refuses to attach builds to internal groups
        # ("Cannot add internal group to a build"), which failed the whole step
        # even though the IPA had already uploaded fine. Internal testers receive
        # every processed build automatically, so nothing is lost. Only list a
        # group here if it is an EXTERNAL one.

  android-release:
    name: Android Release — الضيافة
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: com.aldiafah.aldiafa

    scripts:
      - name: Set TMP path
        script: export TMP=/tmp && export TEMP=/tmp

      - name: Install Flutter dependencies
        script: |
          cd apps/mobile
          flutter pub get

      - name: Build APK
        script: |
          cd apps/mobile
          flutter build apk --release \
            --build-name=1.0.9 \
            --build-number=$PROJECT_BUILD_NUMBER

    artifacts:
      - apps/mobile/build/app/outputs/flutter-apk/app-release.apk
